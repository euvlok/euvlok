name: Set up Nix
description: Install Determinate Nix and configure Cachix for repository workflows.

inputs:
  github-token:
    description: GitHub token used by the Nix installer for GitHub fetches.
    required: false
    default: ""
  cachix-cache:
    description: Cachix cache name.
    required: false
    default: euvlok
  extra-cachix-caches:
    description: Additional Cachix cache names used as substituters.
    required: false
    default: eupkgs,hyprland,nix-community,nixos-raspberrypi
  cachix-auth-token:
    description: Cachix auth token used to push build results.
    required: false
    default: ""
  cachix-skip-push:
    description: Only use Cachix as a substituter without pushing build results.
    required: false
    default: "true"
  extra-nix-config:
    description: Additional Nix configuration appended to the installer config.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Nix
      # v3.22.3
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614
      with:
        github-token: ${{ inputs.github-token }}
        source-tag: v3.22.3
        extra-conf: |
          accept-flake-config = true
          extra-substituters = https://cache.flox.dev https://cache.nixos-cuda.org
          extra-trusted-public-keys = flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
          ${{ inputs.extra-nix-config }}

    - name: Configure Cachix
      id: cachix
      # Read-only consumers may fall back to building locally, but builders
      # that promise to populate Cachix must stop if upload setup fails.
      continue-on-error: ${{ inputs.cachix-skip-push == 'true' }}
      # v17
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        name: ${{ inputs.cachix-cache }}
        extraPullNames: ${{ inputs.extra-cachix-caches }}
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.cachix-skip-push }}
        # Push completed store paths immediately so soft timeouts retain all
        # progress made by the runner.
        useDaemon: true

    - name: Report optional Cachix configuration failure
      if: >-
        steps.cachix.outcome == 'failure' &&
        inputs.cachix-skip-push == 'true'
      shell: bash
      run: |
        echo "::warning::Cachix setup failed. Continuing because this job is configured for read-only cache access."

    - name: Show Nix cache configuration
      shell: bash
      run: |
        nix_version="$(nix --version)"
        echo "${nix_version}"

        case "${nix_version}" in
          "nix (Determinate Nix "*) ;;
          *)
            echo "::error::Expected Determinate Nix, got: ${nix_version}"
            exit 1
            ;;
        esac

        nix config show | sed -n \
          '/^eval-cores = /p;/^experimental-features = /p;/^lazy-trees = /p;/^substituters = /p;/^trusted-public-keys = /p'
