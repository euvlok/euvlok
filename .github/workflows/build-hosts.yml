name: Build Native Hosts

on:
  workflow_call:
    inputs:
      hosts:
        description: JSON matrix of native host configurations.
        required: true
        type: string
      has-hosts:
        description: Whether the matrix contains at least one host.
        required: true
        type: string
      max-parallel:
        description: Maximum builds in this native platform lane.
        required: false
        default: 1
        type: number
      retry-attempt:
        description: Current retry attempt number.
        required: false
        default: "0"
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Token used to push every completed derivation to Cachix.
        required: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  build:
    name: ${{ matrix.class }} / ${{ matrix.owner }} / ${{ matrix.name }}
    if: inputs['has-hosts'] == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      actions: write  # Required to dispatch an isolated retry via the API.
      contents: read
    env:
      CACHIX_CACHE: euvlok
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs['max-parallel'] }}
      matrix: ${{ fromJSON(inputs.hosts) }}
    steps:
      - name: Record build start
        id: build-start
        shell: bash
        run: echo "epoch=$(date +%s)" >>"${GITHUB_OUTPUT}"

      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reclaim maximum Nix store space
        # euvlok fork: pin transitive actions and optimize Holster storage.
        uses: euvlok/nothing-but-nix@ff759c08462436ca9f60d41ff9d0150a63384444
        with:
          hatchet-protocol: rampage

      - name: Build and cache configuration
        id: build
        continue-on-error: true
        uses: ./.github/actions/build-nix-flake-target # zizmor: ignore[self-repository]
        with:
          configuration-kind: ${{ matrix.class }}
          configuration-name: ${{ matrix.name }}
          configuration-system: ${{ matrix.system }}
          cachix-cache: ${{ env.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Configuration builds exist to warm the binary cache. Never spend
          # runner time building if Cachix cannot accept the outputs.
          cachix-skip-push: false
          github-token: ${{ github.token }}
          build-started-at-epoch: ${{ steps.build-start.outputs.epoch }}

      - name: Dispatch isolated retry
        if: >-
          steps.build.outputs.retryable == 'true' &&
          fromJSON(inputs['retry-attempt'] || '0') < 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_SYSTEM: ${{ matrix.system }}
          RETRY_KIND: ${{ matrix.class }}
          RETRY_NAME: ${{ matrix.name }}
          RETRY_ATTEMPT: ${{ inputs['retry-attempt'] || '0' }}
          FAILURE_KIND: ${{ steps.build.outputs.failure-kind }}
          FAILURE_SUMMARY: ${{ steps.build.outputs.failure-summary }}
          FAILED_DRV: ${{ steps.build.outputs.failed-drv }}
        run: |
          next_attempt=$((RETRY_ATTEMPT + 1))

          dispatch_payload="$(
            jq --null-input \
              --arg ref "${GITHUB_REF_NAME}" \
              --arg retry_system "${RETRY_SYSTEM}" \
              --arg retry_kind "${RETRY_KIND}" \
              --arg retry_name "${RETRY_NAME}" \
              --arg retry_attempt "${next_attempt}" \
              --arg retry_reason "${FAILURE_KIND}" \
              '{
                ref: $ref,
                return_run_details: true,
                inputs: {
                  "retry-system": $retry_system,
                  "retry-kind": $retry_kind,
                  "retry-name": $retry_name,
                  "retry-attempt": $retry_attempt,
                  "retry-reason": $retry_reason
                }
              }'
          )"

          dispatch_response="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-configurations.yml/dispatches" \
              --input - <<<"${dispatch_payload}"
          )"
          retry_run_url="$(jq --raw-output '.html_url // empty' <<<"${dispatch_response}")"

          {
            echo "### Isolated retry dispatched"
            echo
            echo "- Configuration: \`${RETRY_KIND} / ${RETRY_NAME}\`"
            echo "- System: \`${RETRY_SYSTEM}\`"
            echo "- Failure class: \`${FAILURE_KIND}\`"
            echo "- Retry attempt: \`${next_attempt}\`"
            echo "- Reason: ${FAILURE_SUMMARY}"
            if [[ -n "${FAILED_DRV}" ]]; then
              echo "- Failed derivation: \`${FAILED_DRV}\`"
            fi
            if [[ -n "${retry_run_url}" ]]; then
              echo "- Retry run: ${retry_run_url}"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Stop retrying after attempt limit
        if: >-
          steps.build.outputs.retryable == 'true' &&
          fromJSON(inputs['retry-attempt'] || '0') >= 3
        shell: bash
        env:
          RETRY_ATTEMPT: ${{ inputs['retry-attempt'] || '0' }}
          FAILURE_SUMMARY: ${{ steps.build.outputs.failure-summary }}
          FAILED_DRV: ${{ steps.build.outputs.failed-drv }}
        run: |
          {
            echo "### Retry limit reached"
            echo
            echo "Attempt \`${RETRY_ATTEMPT}\` reached the configured retry limit."
            echo
            echo "${FAILURE_SUMMARY}"
            if [[ -n "${FAILED_DRV}" ]]; then
              echo
              echo "Failed derivation: \`${FAILED_DRV}\`"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Fail failed build
        if: steps.build.outcome == 'failure' || steps.build.outputs.exit-code != '0'
        shell: bash
        env:
          EXIT_CODE: ${{ steps.build.outputs.exit-code || '1' }}
          FAILURE_KIND: ${{ steps.build.outputs.failure-kind || 'unknown' }}
        run: |
          echo "::error::Build failed with exit code ${EXIT_CODE} (${FAILURE_KIND})."
          exit "${EXIT_CODE}"
