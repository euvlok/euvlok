name: Renovate

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview updates without creating branches, PRs, or issues
        type: choice
        default: full
        options:
          - full
          - "off"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Maintain dependencies
    if:
      vars.RENOVATE_ENABLED == 'true' || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check runner credentials
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${RENOVATE_TOKEN}" ]]; then
            echo "::error::Configure the RENOVATE_TOKEN repository secret with a repository-scoped personal access token."
            exit 1
          fi

      - name: Checkout trusted runner configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}

      - name: Install repository-pinned Nix update tools
        run: nix profile add --inputs-from . nixpkgs#nix-update nixpkgs#devenv

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Validate configuration
        working-directory: .github/renovate
        run: bun run validate

      - name: Install trusted post-upgrade helper
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/renovate-tools"
          install -m755 .github/renovate/postUpgrade.ts \
            "${RUNNER_TEMP}/renovate-tools/euvlokRenovatePostUpgrade.ts"
          echo "${RUNNER_TEMP}/renovate-tools" >>"${GITHUB_PATH}"

      - name: Resolve token owner's commit identity
        id: identity
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        shell: bash
        run: |
          gh api user --jq '
            "username=" + .login + "\ngit-author=" + .login +
            " <" + (.id | tostring) + "+" + .login +
            "@users.noreply.github.com>"
          ' >>"${GITHUB_OUTPUT}"

      - name: Run dependency maintenance
        env:
          RENOVATE_CONFIG_FILE:
            ${{ github.workspace }}/.github/renovate/config.js
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_USERNAME: ${{ steps.identity.outputs.username }}
          RENOVATE_GIT_AUTHOR: ${{ steps.identity.outputs.git-author }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run == 'full' && 'full' || '' }}
          RENOVATE_BASE_DIR: ${{ runner.temp }}/renovate
          LOG_LEVEL: debug
        run: .github/renovate/node_modules/.bin/renovate
