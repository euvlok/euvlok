name: Select Native Host Changes

on:
  workflow_call:
    inputs:
      runner:
        description: Native runner used to evaluate this host platform.
        required: true
        type: string
      system:
        description: Nix system whose host derivations are evaluated.
        required: true
        type: string
      event-name:
        description: Event that invoked the calling workflow.
        required: true
        type: string
      before-revision:
        description: Commit preceding a push, when available.
        required: false
        default: ""
        type: string
      retry-kind:
        description: Configuration class selected by a retry dispatch.
        required: false
        default: ""
        type: string
      retry-name:
        description: Configuration name selected by a retry dispatch.
        required: false
        default: ""
        type: string
    outputs:
      matrix:
        description: Changed hosts for this native platform.
        value: ${{ jobs.select.outputs.matrix }}
      has_hosts:
        description: Whether this native platform selected at least one host.
        value: ${{ jobs.select.outputs.has_hosts }}

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  select:
    name: ${{ inputs.system }}
    runs-on: ${{ inputs.runner }}
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
      has_hosts: ${{ steps.hosts.outputs.has-hosts }}
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout comparison revision
        if: inputs.event-name == 'push'
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
          path: .host-base
          ref: >-
            ${{ inputs.before-revision != '0000000000000000000000000000000000000000'
              && inputs.before-revision || github.sha }}

      - name: Prepare comparison revision
        id: comparison
        if: inputs.event-name == 'push'
        shell: bash
        env:
          BEFORE_REVISION: ${{ inputs.before-revision }}
        run: |
          has_base=true

          if [[ "${BEFORE_REVISION}" == "0000000000000000000000000000000000000000" ]]; then
            if git -C .host-base rev-parse --verify HEAD^ >/dev/null; then
              git -C .host-base checkout --detach HEAD^
            else
              has_base=false
            fi
          fi

          echo "has_base=${has_base}" >>"${GITHUB_OUTPUT}"

      - name: Install Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
          cachix-skip-push: true

      - name: Generate matrix from native host derivations
        id: hosts
        shell: bash
        env:
          BASE_AVAILABLE: ${{ steps.comparison.outputs.has_base }}
          EVENT_NAME: ${{ inputs.event-name }}
          HOST_SYSTEM: ${{ inputs.system }}
          RETRY_KIND: ${{ inputs.retry-kind }}
          RETRY_NAME: ${{ inputs.retry-name }}
        run: |
          host_metadata="$(nix eval --json .#hostMetadata)"
          metadata="$(
            jq --arg system "${HOST_SYSTEM}" \
              'with_entries(select(.value.system == $system))' \
              <<<"${host_metadata}"
          )"

          if [[ "${EVENT_NAME}" == "push" && "${BASE_AVAILABLE}" == "true" ]]; then
            # Force only derivations native to this runner. Some host modules
            # use import-from-derivation and cannot be evaluated cross-platform.
            current_checks="$(
              nix --extra-experimental-features parallel-eval \
                eval --json ".#hostChecksBySystem.${HOST_SYSTEM}"
            )"

            # The base of the first rollout does not expose the partitioned
            # output. Treat its native hosts as changed instead of forcing the
            # old cross-platform hostChecks output.
            if previous_checks="$(
              nix --extra-experimental-features parallel-eval \
                eval --json "./.host-base#hostChecksBySystem.${HOST_SYSTEM}" \
                2>/dev/null
            )"; then
              :
            else
              previous_checks='{}'
            fi

            matrix="$(
              jq --compact-output --null-input \
                --argjson metadata "${metadata}" \
                --argjson current "${current_checks}" \
                --argjson previous "${previous_checks}" \
                '{
                  include: [
                    $metadata |
                    to_entries[] |
                    select(($previous[.key] // null) != $current[.key]) |
                    .value + { name: .key }
                  ]
                }'
            )"
          elif [[ -n "${RETRY_KIND}" || -n "${RETRY_NAME}" ]]; then
            matrix="$(
              jq --compact-output \
                --arg kind "${RETRY_KIND}" \
                --arg name "${RETRY_NAME}" \
                '{
                  include: [
                    to_entries[] |
                    select(.value.class == $kind and .key == $name) |
                    .value + { name: .key }
                  ]
                }' <<<"${metadata}"
            )"
          else
            matrix="$(
              jq --compact-output '{
                include: [
                  to_entries[] |
                  .value + { name: .key }
                ]
              }' <<<"${metadata}"
            )"
          fi

          host_count="$(jq '.include | length' <<<"${matrix}")"

          {
            if ((host_count > 0)); then
              echo "has-hosts=true"
            else
              echo "has-hosts=false"
            fi
            echo "matrix=${matrix}"
          } >>"${GITHUB_OUTPUT}"

          {
            echo "### Selected ${HOST_SYSTEM} configurations"
            echo
            if ((host_count == 0)); then
              echo "No native host derivation changed."
            else
              jq --raw-output \
                '.include[] | "- `\(.class) / \(.owner) / \(.name)`"' \
                <<<"${matrix}"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
