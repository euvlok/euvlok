name: Discover Native Hosts

on:
  workflow_call:
    inputs:
      event-name:
        description: Event that invoked the calling workflow.
        required: true
        type: string
      retry-system:
        description: Native Nix system selected by a retry dispatch.
        required: false
        default: ""
        type: string
      retry-kind:
        description: Configuration class selected by a retry dispatch.
        required: false
        default: ""
        type: string
      retry-name:
        description: Configuration name selected by a retry dispatch.
        required: false
        default: ""
        type: string
    outputs:
      matrix_x86_64_linux:
        description: Eligible x86_64-linux hosts.
        value: ${{ jobs.select.outputs.matrix_x86_64_linux }}
      has_x86_64_linux:
        description: Whether any x86_64-linux host was selected.
        value: ${{ jobs.select.outputs.has_x86_64_linux }}
      matrix_aarch64_linux:
        description: Eligible aarch64-linux hosts.
        value: ${{ jobs.select.outputs.matrix_aarch64_linux }}
      has_aarch64_linux:
        description: Whether any aarch64-linux host was selected.
        value: ${{ jobs.select.outputs.has_aarch64_linux }}
      matrix_aarch64_darwin:
        description: Eligible aarch64-darwin hosts.
        value: ${{ jobs.select.outputs.matrix_aarch64_darwin }}
      has_aarch64_darwin:
        description: Whether any aarch64-darwin host was selected.
        value: ${{ jobs.select.outputs.has_aarch64_darwin }}

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  select:
    name: All native host metadata
    # Inventory is platform-independent and never forces host derivations
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: host-discovery-${{ github.run_id }}
      cancel-in-progress: false
    outputs:
      matrix_x86_64_linux: ${{ steps.hosts.outputs.matrix_x86_64_linux }}
      has_x86_64_linux: ${{ steps.hosts.outputs.has_x86_64_linux }}
      matrix_aarch64_linux: ${{ steps.hosts.outputs.matrix_aarch64_linux }}
      has_aarch64_linux: ${{ steps.hosts.outputs.has_aarch64_linux }}
      matrix_aarch64_darwin: ${{ steps.hosts.outputs.matrix_aarch64_darwin }}
      has_aarch64_darwin: ${{ steps.hosts.outputs.has_aarch64_darwin }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
          cachix-skip-push: true

      - name: Generate matrix from native host metadata
        id: hosts
        shell: bash
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          RETRY_SYSTEM: ${{ inputs.retry-system }}
          RETRY_KIND: ${{ inputs.retry-kind }}
          RETRY_NAME: ${{ inputs.retry-name }}
        run: |
          host_metadata="$(nix eval --json .#hostMetadata)"

          # Derivation comparison belongs to each host job so one broken
          # configuration cannot prevent other native hosts from starting
          if [[ "${EVENT_NAME}" != "push" ]]; then
            matrix="$(
              jq --compact-output \
                --arg system "${RETRY_SYSTEM}" \
                --arg kind "${RETRY_KIND}" \
                --arg name "${RETRY_NAME}" \
                '{
                  include: [
                    to_entries[] |
                    select($system == "" or .value.system == $system) |
                    select(($kind == "" and $name == "") or
                      (.value.class == $kind and .key == $name)) |
                    .value + { name: .key }
                  ]
                }' <<<"${host_metadata}"
            )"
          else
            matrix="$(
              jq --compact-output '{
                include: [
                  to_entries[] |
                  .value + { name: .key }
                ]
              }' <<<"${host_metadata}"
            )"
          fi

          host_count="$(jq '.include | length' <<<"${matrix}")"

          {
            for system in x86_64-linux aarch64-linux aarch64-darwin; do
              output_name="${system//-/_}"
              native_matrix="$(
                jq --compact-output --arg system "${system}" \
                  '{include: [.include[] | select(.system == $system)]}' \
                  <<<"${matrix}"
              )"
              echo "matrix_${output_name}=${native_matrix}"
              echo "has_${output_name}=$(jq '.include | length > 0' <<<"${native_matrix}")"
            done
          } >>"${GITHUB_OUTPUT}"

          {
            echo "### Selected native configurations"
            echo
            if ((host_count == 0)); then
              echo "No native hosts match this selection."
            else
              jq --raw-output \
                '.include[] | "- `\(.class) / \(.owner) / \(.name)`"' \
                <<<"${matrix}"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
