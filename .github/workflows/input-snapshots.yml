name: Input Snapshots

on:
  push:
    branches: [inputs/pruned-zstd]
    paths:
      - "**.nix"
      - "**/flake.lock"
      - .github/scripts/input-snapshots/**
      - .github/workflows/input-snapshots.yml
      - packages/input-trace-nix/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified snapshot as an immutable GitHub release.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: input-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory pinned sources
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      digest: ${{ steps.inventory.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
      - name: Inventory both flake graphs
        id: inventory
        shell: bash
        run: |
          python3 .github/scripts/input-snapshots/input-snapshots.py inventory \
            --output "$RUNNER_TEMP/inventory.json"
          {
            jq -r '"digest=\(.lockDigest)"' "$RUNNER_TEMP/inventory.json"
            jq -c '"matrix=" + ({include: [.sources[] | select(.protected | not) | {id: .id}]} | tojson)' \
              "$RUNNER_TEMP/inventory.json" | jq -r .
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: input-inventory
          path: ${{ runner.temp }}/inventory.json
          if-no-files-found: error

  trace:
    name: Trace native dependencies (${{ matrix.system }})
    needs: inventory
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
      - name: Materialize sources and trace all native outputs
        shell: bash
        env:
          NATIVE_SYSTEM: ${{ matrix.system }}
        run: |
          script=.github/scripts/input-snapshots/input-snapshots.py
          python3 "$script" inventory --output "$RUNNER_TEMP/inventory.json"
          tracer="$(nix build .#input-trace-nix --no-link --print-out-paths --cores 2)"
          python3 "$script" trace --inventory "$RUNNER_TEMP/inventory.json" \
            --system "$NATIVE_SYSTEM" --nix "$tracer/bin/nix" \
            --output "$RUNNER_TEMP/trace"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/trace/usage.json
            ${{ runner.temp }}/trace/baseline.json
          if-no-files-found: error

  compress:
    name: Prune and compress (${{ matrix.id }})
    needs: [inventory, trace]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: input-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trace-*
          path: ${{ runner.temp }}/traces
      - name: Compare compression settings and verify the source hash
        shell: bash
        env:
          SOURCE_ID: ${{ matrix.id }}
        run: |
          nix shell --inputs-from . nixpkgs#zstd --command \
            python3 .github/scripts/input-snapshots/input-snapshots.py pack \
            --inventory "$RUNNER_TEMP/inventory/inventory.json" \
            --traces "$RUNNER_TEMP/traces" \
            --id "$SOURCE_ID" --output "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ matrix.id }}
          path: ${{ runner.temp }}/assets/*
          compression-level: 0
          if-no-files-found: error

  verify:
    name: Verify native derivations (${{ matrix.system }})
    needs: compress
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: input-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: source-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trace-${{ matrix.system }}
          path: ${{ runner.temp }}/trace
      - name: Compare every native derivation with its upstream baseline
        shell: bash
        env:
          NATIVE_SYSTEM: ${{ matrix.system }}
        run: |
          python3 .github/scripts/input-snapshots/input-snapshots.py verify \
            --inventory "$RUNNER_TEMP/inventory/inventory.json" \
            --assets "$RUNNER_TEMP/assets" \
            --baseline "$RUNNER_TEMP/trace/baseline.json" \
            --system "$NATIVE_SYSTEM" --output "$RUNNER_TEMP/verification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.system }}
          path: ${{ runner.temp }}/verification/*.json
          if-no-files-found: error

  assemble:
    name: Assemble verified snapshot
    needs: [inventory, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # Publish a release only when dispatch explicitly requests it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: input-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: source-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
      - name: Assemble the consumer locks
        shell: bash
        env:
          LOCK_DIGEST: ${{ needs.inventory.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="inputs-${LOCK_DIGEST}"
          python3 .github/scripts/input-snapshots/input-snapshots.py locks \
            --inventory "$RUNNER_TEMP/inventory/inventory.json" \
            --assets "$RUNNER_TEMP/assets" \
            --base-url "https://github.com/${REPOSITORY}/releases/download/${tag}" \
            --output "$RUNNER_TEMP/consumer"
          cp "$RUNNER_TEMP/consumer/manifest.json" "$RUNNER_TEMP/assets/manifest.json"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/input-locks.tar" -C "$RUNNER_TEMP/consumer" \
            flake.lock flake-modules/users/flake.lock manifest.json
          nix shell --inputs-from . nixpkgs#zstd --command \
            zstd --ultra -22 --long=27 -T1 "$RUNNER_TEMP/input-locks.tar" \
            -o "$RUNNER_TEMP/assets/input-locks.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: input-snapshot
          path: ${{ runner.temp }}/assets/*
          compression-level: 0
          if-no-files-found: error
      - name: Publish the immutable release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOCK_DIGEST: ${{ needs.inventory.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          tag="inputs-${LOCK_DIGEST}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Snapshot release already exists: ${tag}"
            exit 1
          fi
          gh release create "$tag" "$RUNNER_TEMP/assets/"* \
            --target "$REVISION" --title "Input snapshot ${LOCK_DIGEST}" \
            --notes "Verified input source hashes and compression results are in manifest.json." \
            --latest=false
