name: Build Configurations
run-name: >-
  ${{ inputs['retry-kind'] && inputs['retry-name'] && format('Retry {0} / {1} on {2} (attempt {3}, {4})', inputs['retry-kind'], inputs['retry-name'], inputs['retry-system'], inputs['retry-attempt'] || '0', inputs['retry-reason'] || 'unspecified') || github.event.head_commit.message || github.workflow }}

on:
  push:
  workflow_dispatch:
    inputs:
      retry-system:
        description: Native Nix system to retry.
        required: false
        type: string
      retry-kind:
        description: Configuration kind to retry.
        required: false
        type: string
      retry-name:
        description: Configuration name to retry.
        required: false
        type: string
      retry-attempt:
        description: Current retry attempt number.
        required: false
        default: "0"
        type: string
      retry-reason:
        description: Failure class that caused the retry.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A retry only competes with retries for the same host. A newer push still
  # supersedes an older full build without cancelling unrelated retry lanes.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ inputs['retry-system'] || 'all' }}-${{ inputs['retry-kind'] || 'all' }}-${{ inputs['retry-name'] || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  matrix:
    name: Native Host Inventory
    uses: ./.github/workflows/host-matrix.yml # zizmor: ignore[self-repository]
    with:
      retry-system: ${{ inputs['retry-system'] || '' }}
      event-name: ${{ github.event_name }}
      retry-kind: ${{ inputs['retry-kind'] || '' }}
      retry-name: ${{ inputs['retry-name'] || '' }}

  build-x86-64-linux:
    name: Build Hosts (x86_64-linux)
    needs: matrix
    if: needs.matrix.outputs.has_x86_64_linux == 'true'
    permissions:
      actions: write  # The called workflow may dispatch one isolated retry.
      contents: read
    uses: ./.github/workflows/build-hosts.yml # zizmor: ignore[self-repository]
    with:
      hosts: ${{ needs.matrix.outputs.matrix_x86_64_linux }}
      has-hosts: ${{ needs.matrix.outputs.has_x86_64_linux }}
      event-name: ${{ github.event_name }}
      before-revision: ${{ github.event.before || '' }}
      max-parallel: 2
      retry-attempt: ${{ inputs['retry-attempt'] || '0' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-aarch64-linux:
    name: Build Hosts (aarch64-linux)
    needs: matrix
    if: needs.matrix.outputs.has_aarch64_linux == 'true'
    permissions:
      actions: write  # The called workflow may dispatch one isolated retry.
      contents: read
    uses: ./.github/workflows/build-hosts.yml # zizmor: ignore[self-repository]
    with:
      hosts: ${{ needs.matrix.outputs.matrix_aarch64_linux }}
      has-hosts: ${{ needs.matrix.outputs.has_aarch64_linux }}
      event-name: ${{ github.event_name }}
      before-revision: ${{ github.event.before || '' }}
      max-parallel: 1
      retry-attempt: ${{ inputs['retry-attempt'] || '0' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-aarch64-darwin:
    name: Build Hosts (aarch64-darwin)
    needs: matrix
    if: needs.matrix.outputs.has_aarch64_darwin == 'true'
    permissions:
      actions: write  # The called workflow may dispatch one isolated retry.
      contents: read
    uses: ./.github/workflows/build-hosts.yml # zizmor: ignore[self-repository]
    with:
      hosts: ${{ needs.matrix.outputs.matrix_aarch64_darwin }}
      has-hosts: ${{ needs.matrix.outputs.has_aarch64_darwin }}
      event-name: ${{ github.event_name }}
      before-revision: ${{ github.event.before || '' }}
      max-parallel: 1
      retry-attempt: ${{ inputs['retry-attempt'] || '0' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
